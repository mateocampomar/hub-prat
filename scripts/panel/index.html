<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRAT — Panel de render</title>
<style>
  :root {
    --fondo: #0e1014; --panel: #171a21; --borde: #262b36;
    --texto: #e8eaf0; --tenue: #8b93a5; --acento: #4da3ff;
    --ok: #3ecf8e; --error: #ff6b6b; --ambar: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; }

  /* Todo entra en una pantalla: la página no scrollea, scrollean las columnas.
     min-height:0 es lo que deja que un hijo de grid/flex se encoja en vez de
     empujar el alto; sin eso el scroll interno no aparece nunca. */
  html, body { height: 100%; }
  body {
    background: var(--fondo); color: var(--texto);
    font: 14px/1.5 -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif;
    /* flex y no grid-template-rows: el aviso se oculta con display:none y
       entonces no genera fila, así que el 1fr se lo terminaba llevando el
       footer y main quedaba con su altura natural. */
    display: flex; flex-direction: column;
    gap: 12px; padding: 14px 18px; overflow: hidden;
  }

  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  h1 { font-size: 18px; letter-spacing: .3px; }
  h1 small { color: var(--tenue); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .marcador { display: flex; align-items: baseline; gap: 14px; margin-left: auto; }
  .marcador span { color: var(--tenue); font-size: 12.5px; }
  .marcador b { color: var(--texto); font-size: 17px; margin-left: 4px; }
  .acciones { display: flex; gap: 9px; }

  main {
    display: grid; gap: 12px; min-height: 0; flex: 1;
    grid-template-columns: minmax(300px, 1.05fr) minmax(320px, 1.15fr) minmax(300px, 1fr);
    /* sin esto la fila mide lo que mide el contenido y las cajas no llegan
       hasta abajo, dejando un hueco muerto */
    grid-template-rows: minmax(0, 1fr);
  }
  .caja {
    background: var(--panel); border: 1px solid var(--borde); border-radius: 12px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .caja h2 {
    font-size: 13px; font-weight: 700; letter-spacing: .3px;
    padding: 11px 14px; border-bottom: 1px solid var(--borde);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .caja h2 span { color: var(--tenue); font-weight: 400; font-size: 11.5px; }
  .cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
  .pie { border-top: 1px solid var(--borde); padding: 9px 14px; flex-shrink: 0; }
  .pie #zona { margin-top: 9px; }
  .pie #subidas:not(:empty) { margin-top: 8px; max-height: 132px; overflow-y: auto; }

  footer { min-height: 22px; }

  ul { list-style: none; }
  li.clip {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--borde); border-radius: 9px;
    margin-bottom: 7px; background: #1c202a; cursor: grab; user-select: none;
  }
  li.clip .nombre { font-size: 13.5px; min-width: 0; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  /* En columna angosta la metadata completa no entra: se corta el nombre y
     los datos quedan en una línea propia. */
  li.clip .meta { font-size: 11.5px; white-space: nowrap; }
  li.clip.arrastrando { opacity: .4; }
  li.clip .agarre { color: var(--tenue); font-size: 17px; }
  li.clip .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--borde);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--tenue); flex-shrink: 0;
  }
  li.clip .nombre { flex: 1; font-weight: 600; }
  li.clip .meta { color: var(--tenue); font-size: 12.5px; }
  li.clip.excluido { opacity: .45; }
  li.clip input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--acento); }
  .fila { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .fila label { color: var(--tenue); font-size: 13.5px; }
  input[type=number], select {
    background: #10131a; color: var(--texto);
    border: 1px solid var(--borde); border-radius: 7px; padding: 6px 8px; font-size: 14px;
  }
  input[type=number] { width: 64px; }
  #geomCtrl { transition: opacity .15s; }
  #geomCtrl.off { opacity: .35; pointer-events: none; }
  /* La TV está montada en vertical: la previa se muestra con esa proporción
     para mirarse igual que la pared. */
  .caja.geom .cuerpo { display: flex; flex-direction: column; gap: 10px; }
  .tv {
    flex: 1; min-height: 0; aspect-ratio: 1080 / 1920; margin: 0 auto;
    position: relative; background: #000; border-radius: 7px;
    border: 1px solid var(--borde); overflow: hidden;
  }
  .tv.off { display: none; }
  #vista { display: block; width: 100%; height: 100%; object-fit: fill; }
  /* El ojo de buey: el box-shadow gigante oscurece todo menos el círculo, que
     es justo lo que la portilla física deja ver. */
  #ojo {
    position: absolute; left: 0; width: 100%; aspect-ratio: 1;
    border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 2000px rgba(6, 8, 12, .8);
    outline: 1px solid rgba(255, 255, 255, .22);
  }
  #ojo.off { display: none; }
  button {
    border: 0; border-radius: 8px; padding: 8px 15px; font-size: 13px;
    font-weight: 600; cursor: pointer; color: #0b0d11;
  }
  button:disabled { opacity: .4; cursor: default; }
  #btnPrueba { background: var(--ambar); }
  #btnFinal { background: var(--acento); }
  #btnComando { background: transparent; color: var(--tenue); border: 1px solid var(--borde); }
  #btnCancelar { background: transparent; color: var(--error); border: 1px solid var(--error); }
  #btnGeom {
    margin-left: auto; background: transparent; color: var(--tenue);
    border: 1px solid var(--borde); border-radius: 7px;
    width: 26px; height: 26px; padding: 0; font-size: 13px;
  }
  #btnGeom:hover, #btnGeom.abierto { color: var(--acento); border-color: var(--acento); }
  #geomCtrl[hidden] { display: none; }
  pre {
    background: #10131a; border: 1px solid var(--borde); border-radius: 8px;
    padding: 10px; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-all; color: #b9c2d4; margin-top: 8px; display: none;
    max-height: 108px; overflow-y: auto;
  }
  .barra { height: 10px; background: #10131a; border-radius: 6px; overflow: hidden; margin-top: 12px; display: none; }
  .barra div { height: 100%; width: 0; background: var(--acento); transition: width .5s; }
  .salida {
    display: flex; gap: 11px; align-items: center;
    padding: 8px 10px; border: 1px solid var(--borde); border-radius: 9px;
    margin-bottom: 7px; background: #1c202a;
  }
  .salida img {
    width: 82px; height: 47px; object-fit: cover; flex-shrink: 0;
    border-radius: 5px; background: #000; border: 1px solid var(--borde);
  }
  .salida .datos { flex: 1; min-width: 0; }
  .salida .datos b { display: block; font-size: 14px; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
  .salida .datos span { color: var(--tenue); font-size: 12px; display: block;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Descargar y borrar comparten lenguaje: iconos apagados que se encienden
     al pasar por encima. Ninguno compite por atención con el contenido. */
  .salida a.bajar, .salida button.borrar {
    background: transparent; color: var(--tenue);
    border: 1px solid var(--borde); border-radius: 7px;
    width: 27px; height: 27px; flex-shrink: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; text-decoration: none;
  }
  .salida a.bajar:hover { color: var(--acento); border-color: var(--acento); }
  /* El de borrar va apagado a propósito: no debe competir con Descargar,
     que es la acción de todos los días. */
  .salida button.borrar:hover { color: var(--error); border-color: var(--error); }
  .salida.borrando { opacity: .4; pointer-events: none; }
  #zona {
    border: 1.5px dashed var(--borde); border-radius: 10px; padding: 13px;
    text-align: center; color: var(--tenue); font-size: 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #zona:hover, #zona.encima { border-color: var(--acento); background: #1c202a; color: var(--texto); }
  #zona b { color: var(--acento); }
  .subida { padding: 9px 12px; border: 1px solid var(--borde); border-radius: 9px;
            margin-top: 8px; background: #1c202a; font-size: 13.5px; }
  .subida .cab { display: flex; gap: 10px; align-items: baseline; }
  /* min-width:0 deja que el nombre largo se recorte en vez de empujar el resto. */
  .subida .cab b { flex: 1; min-width: 0; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .subida .cab span { color: var(--tenue); font-size: 12.5px;
                      white-space: nowrap; flex-shrink: 0; }
  .subida .cab button {
    background: transparent; color: var(--tenue); border: 1px solid var(--borde);
    border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 600;
  }
  .subida .cab button:hover { color: var(--error); border-color: var(--error); }
  #aviso {
    background: #1f2436; border: 1px solid #33507d; border-radius: 10px;
    padding: 9px 13px; font-size: 12.5px; display: none;
  }
  #aviso a { font-weight: 600; }
  .subida .pista { height: 6px; background: #10131a; border-radius: 4px; overflow: hidden; margin-top: 7px; }
  .subida .pista div { height: 100%; width: 0; background: var(--acento); transition: width .3s; }
  .subida.lista .pista div { background: var(--ok); }
  .subida.mal .pista div { background: var(--error); }
  #msg { margin-top: 6px; font-size: 12.5px; }
  .barra { margin-top: 0; }

  /* Pantallas chicas: se apilan las columnas y ahí sí scrollea la página. */
  @media (max-width: 1000px) {
    html, body { height: auto; }
    body { overflow: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: none; }
    .caja { max-height: 62vh; }
  }
  .ok { color: var(--ok); } .err { color: var(--error); } .info { color: var(--tenue); }
</style>
</head>
<body>
<header>
  <h1>PRAT <small id="proxima"></small></h1>
  <div class="marcador">
    <span>Total <b id="total">—</b></span>
    <span id="techo"></span>
  </div>
  <div class="acciones">
    <button id="btnComando">Comando</button>
    <button id="btnPrueba">Prueba (5 s/clip)</button>
    <button id="btnFinal">Exportar final</button>
    <button id="btnCancelar" hidden>Cancelar export</button>
  </div>
</header>

<div id="aviso"></div>

<main>
  <section class="caja">
    <h2>Orden de los clips</h2>
    <div class="cuerpo"><ul id="lista"></ul></div>
    <div class="pie">
      <div class="fila">
        <label>Separador <input type="number" id="sep" min="0" step="0.5" value="2"> s</label>
      </div>
      <div id="zona">Arrastrá videos acá o <b>elegí archivos</b><br>
        <span style="font-size:11.5px">se normalizan solos a 29.97 CFR</span></div>
      <input type="file" id="archivos" accept=".mp4,.mov,.MOV,.mkv,.m4v,.avi,.webm,video/*" multiple hidden>
      <div id="subidas"></div>
    </div>
  </section>

  <section class="caja geom">
    <h2>
      <label style="font-weight:700">
        <input type="checkbox" id="geomOn">
        Geometría de la TV
      </label>
      <button id="btnGeom" title="Ajustes de geometría">&#9881;</button>
    </h2>
    <div class="cuerpo">
      <div class="fila" id="geomCtrl" hidden>
        <label>Giro <select id="giro">
          <option value="0">sin girar</option>
          <option value="1">90° horario</option>
          <option value="2">90° antihorario</option>
          <option value="3">90° antih. + espejo</option>
        </select></label>
        <label>OFFX <input type="number" id="offx" min="0" max="1920" step="1"></label>
        <label>OFFY <input type="number" id="offy" min="0" max="1920" step="1"></label>
        <label>previo <select id="vistaClip"></select></label>
      </div>
      <div class="tv" id="tv">
        <img id="vista" alt="vista previa en la TV">
        <div id="ojo"></div>
      </div>
    </div>
  </section>

  <section class="caja">
    <h2>Videos generados <span id="espacio"></span><span id="avisoBajada"></span></h2>
    <div class="cuerpo"><div id="salidas2"></div></div>
  </section>
</main>

<footer>
  <div class="barra" id="barra"><div id="avance"></div></div>
  <div id="msg"></div>
  <pre id="comando"></pre>
</footer>

<script>
let clips = [];          // [{nombre, dur, mb, fps, res, activo}]
let corriendo = false;

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); const m = Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };
const activos = () => clips.filter(c => c.activo);

const TECHO = 30 * 60;   // el proyecto no puede pasar de 30 min

function calcTotal() {
  const n = activos().length;
  if (!n) { $('total').textContent = '—'; return; }
  const sep = parseFloat($('sep').value) || 0;
  const t = activos().reduce((a,c) => a + c.dur, 0) + sep * (n - 1);
  // Un segundo de tolerancia: cortar en keyframe deja sobras de centésimas y
  // "se pasa 0:00" no le sirve a nadie.
  const excede = t > TECHO + 1;
  const e = $('total');
  e.textContent = fmt(t);
  e.style.color = excede ? 'var(--error)' : '';
  $('techo').textContent = excede
    ? `se pasa ${fmt(t - TECHO)} del techo de 30 min`
    : (TECHO - t < 1 ? 'justo en el techo de 30 min'
                     : `quedan ${fmt(TECHO - t)} para el techo de 30 min`);
  $('techo').style.color = excede ? 'var(--error)' : 'var(--tenue)';
}

function render() {
  const ul = $('lista');
  ul.innerHTML = '';
  let pos = 0;
  clips.forEach((c, i) => {
    const li = document.createElement('li');
    li.className = 'clip' + (c.activo ? '' : ' excluido');
    li.draggable = true;
    li.dataset.i = i;
    li.innerHTML = `
      <span class="agarre">⠿</span>
      <span class="num">${c.activo ? ++pos : '·'}</span>
      <span class="nombre" title="${c.nombre}">${c.nombre}</span>
      <span class="meta" title="${c.res} · ${c.fps}">${fmt(c.dur)} · ${c.mb} MB</span>
      <input type="checkbox" ${c.activo ? 'checked' : ''} title="incluir en el render">`;
    li.querySelector('input').onchange = e => { c.activo = e.target.checked; render(); guardar(); };
    li.addEventListener('dragstart', e => { li.classList.add('arrastrando'); e.dataTransfer.setData('text', i); });
    li.addEventListener('dragend', () => li.classList.remove('arrastrando'));
    li.addEventListener('dragover', e => e.preventDefault());
    li.addEventListener('drop', e => {
      e.preventDefault();
      const desde = +e.dataTransfer.getData('text');
      const hasta = +li.dataset.i;
      if (desde === hasta) return;
      clips.splice(hasta, 0, clips.splice(desde, 1)[0]);
      render(); guardar();
    });
    ul.appendChild(li);
  });
  calcTotal();
}

async function guardar() {
  await fetch('/api/orden', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ orden: clips.map(c => c.nombre),
                           sep: parseFloat($('sep').value) || 2,
                           geom: geomActual() }) });
}

function geomActual() {
  return { activa: $('geomOn').checked, giro: +$('giro').value,
           offx: +$('offx').value || 0, offy: +$('offy').value || 0 };
}

function cuerpoExport(modo) {
  return JSON.stringify({ orden: activos().map(c => c.nombre),
                          sep: parseFloat($('sep').value) || 2,
                          geom: geomActual(), modo });
}

let tVista = null;
const ALTO_TV = 1920;   // alto del lienzo, en px de la TV parada

function refrescarVista() {
  const g = geomActual();
  $('geomCtrl').className = 'fila' + (g.activa ? '' : ' off');
  $('tv').className = 'tv' + (g.activa ? '' : ' off');
  if (!g.activa) return;

  // El recorte cuadrado ocupa todo el ancho de la TV parada, y OFFX es lo que
  // baja desde el borde de arriba: ahí queda el ojo de buey.
  $('ojo').style.top = (g.offx / ALTO_TV * 100).toFixed(2) + '%';

  const clip = $('vistaClip').value;
  if (!clip) return;
  // Cada cuadro sale de un ffmpeg: al arrastrar los números conviene esperar.
  clearTimeout(tVista);
  tVista = setTimeout(() => {
    $('vista').src = `/api/vista?clip=${encodeURIComponent(clip)}&seg=10&tv=1` +
      `&activa=1&giro=${g.giro}&offx=${g.offx}&offy=${g.offy}&t=${performance.now()|0}`;
  }, 250);
}

async function verComando(modo) {
  const r = await fetch('/api/comando', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: cuerpoExport(modo) });
  const d = await r.json();
  const pre = $('comando');
  pre.style.display = 'block';
  if (d.error) { pre.textContent = 'Error: ' + d.error; return null; }
  pre.textContent = `# salida: ${d.salida}  (${fmt(d.dur)}${d.copia ? ', concat sin re-encode' : ', re-encode'})\n` + d.comando;
  return d;
}

async function exportar(modo) {
  if (corriendo || !activos().length) return;
  await verComando(modo);
  const r = await fetch('/api/exportar', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: cuerpoExport(modo) });
  const d = await r.json();
  if (d.error) { $('msg').innerHTML = `<span class="err">${d.error}</span>`; return; }
  corriendo = true;
  $('barra').style.display = 'block';
  seguir();
}

async function seguir() {
  const r = await fetch('/api/estado');
  const e = await r.json();
  $('avance').style.width = (e.progreso * 100).toFixed(1) + '%';
  $('btnCancelar').hidden = e.estado !== 'corriendo';
  if (e.estado === 'corriendo') {
    $('msg').innerHTML = `<span class="info">Exportando ${e.salida}… ${(e.progreso*100).toFixed(0)} %</span>`;
    setTimeout(seguir, 1000);
  } else if (e.estado === 'idle') {
    corriendo = false;
    $('barra').style.display = 'none';
    $('msg').innerHTML = '<span class="info">Export cancelado</span>';
    cargarSalidas();
  } else if (e.estado === 'ok') {
    corriendo = false;
    $('msg').innerHTML = `<span class="ok">Listo: ${e.salida}</span>`;
    cargar();
    cargarSalidas();
  } else if (e.estado === 'error') {
    corriendo = false;
    $('msg').innerHTML = `<span class="err">Falló el export</span><pre style="display:block">${e.log}</pre>`;
  }
}

// Entrar por el dominio manda cada byte al datacenter de Cloudflare y lo trae
// de vuelta. Por Tailscale o la LAN el archivo va derecho a la Mac mini.
async function chequearVia() {
  try {
    const d = await (await fetch('/api/acceso')).json();
    if (!d.por_cloudflare || !d.directas.length) return;
    $('avisoBajada').textContent = 'por la vía directa bajan mucho más rápido';
    const v = d.directas[0];
    $('aviso').style.display = 'block';
    $('aviso').innerHTML =
      `Estás entrando por Cloudflare: para subir videos, cada byte viaja al ` +
      `datacenter y vuelve. Si tenés ${v.via} andando, ` +
      `<a href="${v.url}">abrí el panel por la vía directa</a> y las subidas ` +
      `van derecho a la Mac mini.`;
  } catch (_) {}
}

let geomCargada = false;
// ---- Videos generados ----
const gb = b => b >= 1e9 ? (b/1e9).toFixed(2) + ' GB' : (b/1e6).toFixed(0) + ' MB';

function fecha(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString('es-UY', {day:'2-digit', month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit', hour12:false});
}

async function borrarSalida(s, div) {
  // Borra del disco y no hay papelera: se confirma con nombre y peso a la vista.
  if (!confirm(`¿Borrar ${s.nombre} del disco?\n\n` +
               `${fmt(s.dur)} · ${gb(s.bytes)}\n\n` +
               `Se elimina de la Mac mini y no va a la papelera.`)) return;
  div.classList.add('borrando');
  try {
    const r = await fetch('/api/borrar?archivo=' + encodeURIComponent(s.nombre),
                          { method: 'POST' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $('msg').innerHTML = `<span class="info">Borrado ${s.nombre} · ` +
                         `${gb(d.liberado)} liberados</span>`;
  } catch (e) {
    div.classList.remove('borrando');
    $('msg').innerHTML = `<span class="err">No se pudo borrar: ${e.message}</span>`;
  }
  cargarSalidas();
}

async function cargarSalidas() {
  let d;
  try { d = await (await fetch('/api/renders')).json(); } catch (_) { return; }
  const cont = $('salidas2');
  cont.innerHTML = '';
  if (d.espacio) $('espacio').textContent =
    `${gb(d.espacio.ocupado)} en uso · ${gb(d.espacio.libre)} libres`;
  if (!d.salidas.length) {
    cont.innerHTML = '<span style="color:var(--tenue);font-size:13.5px">' +
                     'Todavía no hay videos generados.</span>';
    return;
  }
  for (const s of d.salidas) {
    const div = document.createElement('div');
    div.className = 'salida';
    const url = '/api/descargar?archivo=' + encodeURIComponent(s.nombre);
    div.innerHTML = `
      <img loading="lazy" src="/api/miniatura?archivo=${encodeURIComponent(s.nombre)}" alt="">
      <div class="datos">
        <b>${s.nombre}</b>
        <span>${fmt(s.dur)} · ${gb(s.bytes)} · ${fecha(s.mtime)}${
          s.tipo === 'prueba' ? ' · prueba' : ''}</span>
      </div>
      <a class="bajar" href="${url}" download title="Descargar">\u2193</a>
      <button class="borrar" title="Borrar del disco">\u00d7</button>`;
    div.querySelector('.borrar').onclick = () => borrarSalida(s, div);
    cont.appendChild(div);
  }
}

async function cargar() {
  const d = await (await fetch('/api/clips')).json();
  const previos = Object.fromEntries(clips.map(c => [c.nombre, c.activo]));
  clips = d.clips.map(c => ({ ...c, activo: previos[c.nombre] ?? true }));
  $('sep').value = d.sep;
  $('proxima').textContent = 'próxima salida: ' + d.proxima;

  // Los valores guardados se cargan una sola vez: si no, pisarían lo que
  // estés ajustando cada vez que se refresca la lista.
  if (!geomCargada && d.geom) {
    geomCargada = true;
    $('geomOn').checked = d.geom.activa;
    $('giro').value = d.geom.giro;
    $('offx').value = d.geom.offx;
    $('offy').value = d.geom.offy;
  }
  const sel = $('vistaClip'), previo = sel.value;
  sel.innerHTML = clips.map(c => `<option>${c.nombre}</option>`).join('');
  if (previo && clips.some(c => c.nombre === previo)) sel.value = previo;
  render();
  refrescarVista();
}

// ---- Subida de videos ----
// El archivo va en trozos: Cloudflare rechaza request de más de 100 MB y corta
// los que tardan demasiado. Trozos chicos = progreso fino y reintentos baratos.
const TROZO = 8 * 1024 * 1024;
const REINTENTOS = 4;
const filas = {};        // clave -> elemento de la lista de subidas
const xhrs = {};         // clave -> request en vuelo, para poder abortarlo
const cancelados = new Set();
let cola = Promise.resolve();

const mb = b => (b / 1048576).toFixed(0) + ' MB';

function fila(clave) {
  if (filas[clave]) return filas[clave];
  const div = document.createElement('div');
  div.className = 'subida';
  div.innerHTML = `<div class="cab"><b></b><span></span><button>cancelar</button></div>
                   <div class="pista"><div></div></div>`;
  div.querySelector('b').textContent = clave;
  div.querySelector('button').onclick = () => cancelar(clave);
  $('subidas').appendChild(div);
  return (filas[clave] = div);
}

function pintar(clave, texto, frac, clase) {
  const d = fila(clave);
  d.querySelector('span').textContent = texto;
  d.querySelector('.pista div').style.width = ((frac || 0) * 100).toFixed(1) + '%';
  d.className = 'subida' + (clase ? ' ' + clase : '');
  // El botón solo tiene sentido mientras la subida sigue viva.
  d.querySelector('button').style.display = clase ? 'none' : '';
}

async function cancelar(clave) {
  cancelados.add(clave);
  if (xhrs[clave]) xhrs[clave].abort();     // corta el trozo en vuelo
  try {
    await fetch('/api/cancelar?nombre=' + encodeURIComponent(clave),
                { method: 'POST' });        // borra lo subido hasta ahí
  } catch (_) {}
  pintar(clave, 'cancelada', 0, 'mal');
}

// fetch no informa el avance de la subida; XHR sí, vía upload.onprogress.
function enviarTrozo(clave, url, blob, alAvanzar) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    xhrs[clave] = x;
    x.onabort = () => reject(new Error('cancelada'));
    x.open('POST', url);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) alAvanzar(e.loaded); };
    x.onload = () => {
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (_) {}
      if (x.status >= 200 && x.status < 300 && !d.error) resolve(d);
      else reject(new Error(d.error || `HTTP ${x.status}`));
    };
    x.onerror = () => reject(new Error('se cortó la conexión'));
    x.ontimeout = () => reject(new Error('tardó demasiado'));
    x.send(blob);
  });
}

async function recibido(nombre) {
  try {
    const r = await fetch('/api/subida?nombre=' + encodeURIComponent(nombre));
    const d = await r.json();
    return d.recibido || 0;
  } catch (_) { return 0; }
}

async function subir(archivo) {
  const clave = archivo.name;
  cancelados.delete(clave);
  // La fila aparece ya mismo: el primer trozo tarda y sin esto la pantalla
  // queda muerta y parece que no pasa nada.
  pintar(clave, `en cola · ${mb(archivo.size)}`, 0);

  // Si quedó una subida a medias de este mismo archivo, se retoma ahí.
  let offset = await recibido(clave);
  if (offset > archivo.size) offset = 0;
  if (offset) pintar(clave, `retomando desde ${mb(offset)}`, offset / archivo.size);

  const avance = (parcial) => pintar(clave,
    `subiendo ${mb(offset + parcial)} de ${mb(archivo.size)} · ` +
    `${((offset + parcial) / archivo.size * 100).toFixed(0)} %`,
    (offset + parcial) / archivo.size);

  while (offset < archivo.size) {
    if (cancelados.has(clave)) return;
    let d = null;
    for (let intento = 1; intento <= REINTENTOS && !d; intento++) {
      // Dentro del reintento: si el offset se re-sincronizó, el trozo y la URL
      // tienen que rearmarse con el valor nuevo.
      const fin = Math.min(offset + TROZO, archivo.size);
      const ultimo = fin >= archivo.size;
      const url = `/api/subir?nombre=${encodeURIComponent(clave)}` +
                  `&offset=${offset}&final=${ultimo ? 1 : 0}`;
      try {
        avance(0);
        d = await enviarTrozo(clave, url, archivo.slice(offset, fin), avance);
        offset = fin;
      } catch (e) {
        if (cancelados.has(clave)) return;   // no es un fallo, lo paraste vos
        if (intento === REINTENTOS) {
          pintar(clave, 'falló: ' + e.message, offset / archivo.size, 'mal');
          return;
        }
        pintar(clave, `reintentando (${intento}/${REINTENTOS}): ${e.message}`,
               offset / archivo.size);
        await new Promise(r => setTimeout(r, 1500 * intento));
        // El servidor manda: puede haber recibido más o menos de lo que creemos.
        offset = await recibido(clave);
      }
    }
    delete xhrs[clave];
    if (d.completo) {
      pintar(clave, 'subido, normalizando…', 1);
      // El servidor puede haberlo renombrado para no pisar otro archivo.
      if (d.nombre !== clave) {
        filas[d.nombre] = filas[clave];
        filas[d.nombre].querySelector('b').textContent = d.nombre;
      }
      seguirTrabajos();
    }
  }
}

let poll = null;
async function seguirTrabajos() {
  if (poll) return;
  poll = setInterval(async () => {
    const t = await (await fetch('/api/trabajos')).json();
    let quedan = false;
    for (const [nombre, j] of Object.entries(t)) {
      if (!filas[nombre]) continue;
      if (j.estado === 'ok') pintar(nombre, j.mensaje, 1, 'lista');
      else if (j.estado === 'error') pintar(nombre, 'error: ' + j.mensaje, 1, 'mal');
      else { quedan = true; pintar(nombre, `${j.mensaje} ${((j.progreso||0)*100).toFixed(0)} %`, j.progreso); }
    }
    cargar();
    if (!quedan) { clearInterval(poll); poll = null; }
  }, 1500);
}

// De a uno por vez: dos subidas en paralelo se pelean el ancho de banda y
// tardan más las dos.
function encolar(archivos) {
  [...archivos].forEach(a => { cola = cola.then(() => subir(a)); });
}

const zona = $('zona');
zona.onclick = () => $('archivos').click();
$('archivos').onchange = e => { encolar(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.add('encima'); }));
['dragleave','drop'].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.remove('encima'); }));
zona.addEventListener('drop', e => encolar(e.dataTransfer.files));

$('sep').onchange = () => { calcTotal(); guardar(); };
['geomOn','giro','offx','offy'].forEach(id =>
  $(id).oninput = () => { refrescarVista(); guardar(); });
$('vistaClip').onchange = refrescarVista;
$('btnGeom').onclick = () => {
  const oculto = $('geomCtrl').hidden;
  $('geomCtrl').hidden = !oculto;
  $('btnGeom').classList.toggle('abierto', oculto);
};
$('btnComando').onclick = () => verComando('final');
$('btnPrueba').onclick = () => exportar('prueba');
$('btnFinal').onclick = () => exportar('final');
$('btnCancelar').onclick = async () => {
  // El parcial se borra del lado del servidor: son gigas que no sirven.
  await fetch('/api/cancelar-export', { method: 'POST' });
};
cargar();
cargarSalidas();
chequearVia();
</script>
