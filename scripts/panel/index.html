<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRAT — Panel de render</title>
<style>
  :root {
    --fondo: #0e1014; --panel: #171a21; --borde: #262b36;
    --texto: #e8eaf0; --tenue: #8b93a5; --acento: #4da3ff;
    --ok: #3ecf8e; --error: #ff6b6b; --ambar: #ffb454;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--fondo); color: var(--texto);
    font: 15px/1.5 -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif;
    max-width: 780px; margin: 0 auto; padding: 32px 20px 60px;
  }
  h1 { font-size: 20px; letter-spacing: .3px; }
  h1 small { color: var(--tenue); font-weight: 400; margin-left: 10px; font-size: 13px; }
  .caja {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 12px; padding: 16px; margin-top: 18px;
  }
  ul { list-style: none; }
  li.clip {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 1px solid var(--borde); border-radius: 9px;
    margin-bottom: 8px; background: #1c202a; cursor: grab; user-select: none;
  }
  li.clip.arrastrando { opacity: .4; }
  li.clip .agarre { color: var(--tenue); font-size: 17px; }
  li.clip .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--borde);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--tenue); flex-shrink: 0;
  }
  li.clip .nombre { flex: 1; font-weight: 600; }
  li.clip .meta { color: var(--tenue); font-size: 12.5px; }
  li.clip.excluido { opacity: .45; }
  li.clip input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--acento); }
  .fila { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .fila label { color: var(--tenue); font-size: 13.5px; }
  input[type=number] {
    width: 64px; background: #10131a; color: var(--texto);
    border: 1px solid var(--borde); border-radius: 7px; padding: 6px 8px; font-size: 14px;
  }
  .total { margin-left: auto; font-size: 13.5px; color: var(--tenue); }
  .total b { color: var(--texto); font-size: 15px; }
  button {
    border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px;
    font-weight: 600; cursor: pointer; color: #0b0d11;
  }
  button:disabled { opacity: .4; cursor: default; }
  #btnPrueba { background: var(--ambar); }
  #btnFinal { background: var(--acento); }
  #btnComando { background: transparent; color: var(--tenue); border: 1px solid var(--borde); }
  pre {
    background: #10131a; border: 1px solid var(--borde); border-radius: 8px;
    padding: 12px; font-size: 12px; line-height: 1.55; white-space: pre-wrap;
    word-break: break-all; color: #b9c2d4; margin-top: 12px; display: none;
  }
  .barra { height: 10px; background: #10131a; border-radius: 6px; overflow: hidden; margin-top: 12px; display: none; }
  .barra div { height: 100%; width: 0; background: var(--acento); transition: width .5s; }
  #zona {
    border: 1.5px dashed var(--borde); border-radius: 10px; padding: 22px;
    text-align: center; color: var(--tenue); font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #zona:hover, #zona.encima { border-color: var(--acento); background: #1c202a; color: var(--texto); }
  #zona b { color: var(--acento); }
  .subida { padding: 9px 12px; border: 1px solid var(--borde); border-radius: 9px;
            margin-top: 8px; background: #1c202a; font-size: 13.5px; }
  .subida .cab { display: flex; gap: 10px; align-items: baseline; }
  /* min-width:0 deja que el nombre largo se recorte en vez de empujar el resto. */
  .subida .cab b { flex: 1; min-width: 0; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .subida .cab span { color: var(--tenue); font-size: 12.5px;
                      white-space: nowrap; flex-shrink: 0; }
  .subida .cab button {
    background: transparent; color: var(--tenue); border: 1px solid var(--borde);
    border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 600;
  }
  .subida .cab button:hover { color: var(--error); border-color: var(--error); }
  #aviso {
    background: #1f2436; border: 1px solid #33507d; border-radius: 10px;
    padding: 12px 15px; margin-bottom: 14px; font-size: 13.5px; display: none;
  }
  #aviso a { font-weight: 600; }
  .subida .pista { height: 6px; background: #10131a; border-radius: 4px; overflow: hidden; margin-top: 7px; }
  .subida .pista div { height: 100%; width: 0; background: var(--acento); transition: width .3s; }
  .subida.lista .pista div { background: var(--ok); }
  .subida.mal .pista div { background: var(--error); }
  #msg { margin-top: 10px; font-size: 13.5px; min-height: 20px; }
  .ok { color: var(--ok); } .err { color: var(--error); } .info { color: var(--tenue); }
</style>
</head>
<body>
<h1>PRAT — Panel de render <small id="proxima"></small></h1>

<div id="aviso"></div>

<div class="caja">
  <div id="zona">Arrastrá videos acá o <b>elegí archivos</b><br>
    <span style="font-size:12.5px">se normalizan solos a 29.97 CFR y entran a la lista</span></div>
  <input type="file" id="archivos" accept=".mp4,.mov,.MOV,.mkv,.m4v,.avi,.webm,video/*" multiple hidden>
  <div id="subidas"></div>
</div>

<div class="caja">
  <ul id="lista"></ul>
  <div class="fila" style="margin-top:6px">
    <label>Separador (negro): <input type="number" id="sep" min="0" step="0.5" value="2"> s</label>
    <span class="total">Duración total: <b id="total">—</b></span>
  </div>
  <div id="techo" style="text-align:right; font-size:12.5px; color:var(--tenue); margin-top:4px"></div>
</div>

<div class="caja">
  <div class="fila">
    <button id="btnComando">Ver comando ffmpeg</button>
    <button id="btnPrueba">Exportar prueba (5 s/clip)</button>
    <button id="btnFinal">Exportar final</button>
  </div>
  <pre id="comando"></pre>
  <div class="barra" id="barra"><div id="avance"></div></div>
  <div id="msg"></div>
</div>

<script>
let clips = [];          // [{nombre, dur, mb, fps, res, activo}]
let corriendo = false;

const $ = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); const m = Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };
const activos = () => clips.filter(c => c.activo);

const TECHO = 30 * 60;   // el proyecto no puede pasar de 30 min

function calcTotal() {
  const n = activos().length;
  if (!n) { $('total').textContent = '—'; return; }
  const sep = parseFloat($('sep').value) || 0;
  const t = activos().reduce((a,c) => a + c.dur, 0) + sep * (n - 1);
  // Un segundo de tolerancia: cortar en keyframe deja sobras de centésimas y
  // "se pasa 0:00" no le sirve a nadie.
  const excede = t > TECHO + 1;
  const e = $('total');
  e.textContent = fmt(t);
  e.style.color = excede ? 'var(--error)' : '';
  $('techo').textContent = excede
    ? `se pasa ${fmt(t - TECHO)} del techo de 30 min`
    : (TECHO - t < 1 ? 'justo en el techo de 30 min'
                     : `quedan ${fmt(TECHO - t)} para el techo de 30 min`);
  $('techo').style.color = excede ? 'var(--error)' : 'var(--tenue)';
}

function render() {
  const ul = $('lista');
  ul.innerHTML = '';
  let pos = 0;
  clips.forEach((c, i) => {
    const li = document.createElement('li');
    li.className = 'clip' + (c.activo ? '' : ' excluido');
    li.draggable = true;
    li.dataset.i = i;
    li.innerHTML = `
      <span class="agarre">⠿</span>
      <span class="num">${c.activo ? ++pos : '·'}</span>
      <span class="nombre">${c.nombre}</span>
      <span class="meta">${fmt(c.dur)} · ${c.res} · ${c.fps} · ${c.mb} MB</span>
      <input type="checkbox" ${c.activo ? 'checked' : ''} title="incluir en el render">`;
    li.querySelector('input').onchange = e => { c.activo = e.target.checked; render(); guardar(); };
    li.addEventListener('dragstart', e => { li.classList.add('arrastrando'); e.dataTransfer.setData('text', i); });
    li.addEventListener('dragend', () => li.classList.remove('arrastrando'));
    li.addEventListener('dragover', e => e.preventDefault());
    li.addEventListener('drop', e => {
      e.preventDefault();
      const desde = +e.dataTransfer.getData('text');
      const hasta = +li.dataset.i;
      if (desde === hasta) return;
      clips.splice(hasta, 0, clips.splice(desde, 1)[0]);
      render(); guardar();
    });
    ul.appendChild(li);
  });
  calcTotal();
}

async function guardar() {
  await fetch('/api/orden', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ orden: clips.map(c => c.nombre), sep: parseFloat($('sep').value) || 2 }) });
}

function cuerpoExport(modo) {
  return JSON.stringify({ orden: activos().map(c => c.nombre),
                          sep: parseFloat($('sep').value) || 2, modo });
}

async function verComando(modo) {
  const r = await fetch('/api/comando', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: cuerpoExport(modo) });
  const d = await r.json();
  const pre = $('comando');
  pre.style.display = 'block';
  if (d.error) { pre.textContent = 'Error: ' + d.error; return null; }
  pre.textContent = `# salida: ${d.salida}  (${fmt(d.dur)}${d.copia ? ', concat sin re-encode' : ', re-encode'})\n` + d.comando;
  return d;
}

async function exportar(modo) {
  if (corriendo || !activos().length) return;
  await verComando(modo);
  const r = await fetch('/api/exportar', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: cuerpoExport(modo) });
  const d = await r.json();
  if (d.error) { $('msg').innerHTML = `<span class="err">${d.error}</span>`; return; }
  corriendo = true;
  $('barra').style.display = 'block';
  seguir();
}

async function seguir() {
  const r = await fetch('/api/estado');
  const e = await r.json();
  $('avance').style.width = (e.progreso * 100).toFixed(1) + '%';
  if (e.estado === 'corriendo') {
    $('msg').innerHTML = `<span class="info">Exportando ${e.salida}… ${(e.progreso*100).toFixed(0)} %</span>`;
    setTimeout(seguir, 1000);
  } else if (e.estado === 'ok') {
    corriendo = false;
    $('msg').innerHTML = `<span class="ok">Listo: ${e.salida}</span>`;
    cargar();
  } else if (e.estado === 'error') {
    corriendo = false;
    $('msg').innerHTML = `<span class="err">Falló el export</span><pre style="display:block">${e.log}</pre>`;
  }
}

// Entrar por el dominio manda cada byte al datacenter de Cloudflare y lo trae
// de vuelta. Por Tailscale o la LAN el archivo va derecho a la Mac mini.
async function chequearVia() {
  try {
    const d = await (await fetch('/api/acceso')).json();
    if (!d.por_cloudflare || !d.directas.length) return;
    const v = d.directas[0];
    $('aviso').style.display = 'block';
    $('aviso').innerHTML =
      `Estás entrando por Cloudflare: para subir videos, cada byte viaja al ` +
      `datacenter y vuelve. Si tenés ${v.via} andando, ` +
      `<a href="${v.url}">abrí el panel por la vía directa</a> y las subidas ` +
      `van derecho a la Mac mini.`;
  } catch (_) {}
}

async function cargar() {
  const d = await (await fetch('/api/clips')).json();
  const previos = Object.fromEntries(clips.map(c => [c.nombre, c.activo]));
  clips = d.clips.map(c => ({ ...c, activo: previos[c.nombre] ?? true }));
  $('sep').value = d.sep;
  $('proxima').textContent = 'próxima salida: ' + d.proxima;
  render();
}

// ---- Subida de videos ----
// El archivo va en trozos: Cloudflare rechaza request de más de 100 MB y corta
// los que tardan demasiado. Trozos chicos = progreso fino y reintentos baratos.
const TROZO = 8 * 1024 * 1024;
const REINTENTOS = 4;
const filas = {};        // clave -> elemento de la lista de subidas
const xhrs = {};         // clave -> request en vuelo, para poder abortarlo
const cancelados = new Set();
let cola = Promise.resolve();

const mb = b => (b / 1048576).toFixed(0) + ' MB';

function fila(clave) {
  if (filas[clave]) return filas[clave];
  const div = document.createElement('div');
  div.className = 'subida';
  div.innerHTML = `<div class="cab"><b></b><span></span><button>cancelar</button></div>
                   <div class="pista"><div></div></div>`;
  div.querySelector('b').textContent = clave;
  div.querySelector('button').onclick = () => cancelar(clave);
  $('subidas').appendChild(div);
  return (filas[clave] = div);
}

function pintar(clave, texto, frac, clase) {
  const d = fila(clave);
  d.querySelector('span').textContent = texto;
  d.querySelector('.pista div').style.width = ((frac || 0) * 100).toFixed(1) + '%';
  d.className = 'subida' + (clase ? ' ' + clase : '');
  // El botón solo tiene sentido mientras la subida sigue viva.
  d.querySelector('button').style.display = clase ? 'none' : '';
}

async function cancelar(clave) {
  cancelados.add(clave);
  if (xhrs[clave]) xhrs[clave].abort();     // corta el trozo en vuelo
  try {
    await fetch('/api/cancelar?nombre=' + encodeURIComponent(clave),
                { method: 'POST' });        // borra lo subido hasta ahí
  } catch (_) {}
  pintar(clave, 'cancelada', 0, 'mal');
}

// fetch no informa el avance de la subida; XHR sí, vía upload.onprogress.
function enviarTrozo(clave, url, blob, alAvanzar) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    xhrs[clave] = x;
    x.onabort = () => reject(new Error('cancelada'));
    x.open('POST', url);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable) alAvanzar(e.loaded); };
    x.onload = () => {
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (_) {}
      if (x.status >= 200 && x.status < 300 && !d.error) resolve(d);
      else reject(new Error(d.error || `HTTP ${x.status}`));
    };
    x.onerror = () => reject(new Error('se cortó la conexión'));
    x.ontimeout = () => reject(new Error('tardó demasiado'));
    x.send(blob);
  });
}

async function recibido(nombre) {
  try {
    const r = await fetch('/api/subida?nombre=' + encodeURIComponent(nombre));
    const d = await r.json();
    return d.recibido || 0;
  } catch (_) { return 0; }
}

async function subir(archivo) {
  const clave = archivo.name;
  cancelados.delete(clave);
  // La fila aparece ya mismo: el primer trozo tarda y sin esto la pantalla
  // queda muerta y parece que no pasa nada.
  pintar(clave, `en cola · ${mb(archivo.size)}`, 0);

  // Si quedó una subida a medias de este mismo archivo, se retoma ahí.
  let offset = await recibido(clave);
  if (offset > archivo.size) offset = 0;
  if (offset) pintar(clave, `retomando desde ${mb(offset)}`, offset / archivo.size);

  const avance = (parcial) => pintar(clave,
    `subiendo ${mb(offset + parcial)} de ${mb(archivo.size)} · ` +
    `${((offset + parcial) / archivo.size * 100).toFixed(0)} %`,
    (offset + parcial) / archivo.size);

  while (offset < archivo.size) {
    if (cancelados.has(clave)) return;
    let d = null;
    for (let intento = 1; intento <= REINTENTOS && !d; intento++) {
      // Dentro del reintento: si el offset se re-sincronizó, el trozo y la URL
      // tienen que rearmarse con el valor nuevo.
      const fin = Math.min(offset + TROZO, archivo.size);
      const ultimo = fin >= archivo.size;
      const url = `/api/subir?nombre=${encodeURIComponent(clave)}` +
                  `&offset=${offset}&final=${ultimo ? 1 : 0}`;
      try {
        avance(0);
        d = await enviarTrozo(clave, url, archivo.slice(offset, fin), avance);
        offset = fin;
      } catch (e) {
        if (cancelados.has(clave)) return;   // no es un fallo, lo paraste vos
        if (intento === REINTENTOS) {
          pintar(clave, 'falló: ' + e.message, offset / archivo.size, 'mal');
          return;
        }
        pintar(clave, `reintentando (${intento}/${REINTENTOS}): ${e.message}`,
               offset / archivo.size);
        await new Promise(r => setTimeout(r, 1500 * intento));
        // El servidor manda: puede haber recibido más o menos de lo que creemos.
        offset = await recibido(clave);
      }
    }
    delete xhrs[clave];
    if (d.completo) {
      pintar(clave, 'subido, normalizando…', 1);
      // El servidor puede haberlo renombrado para no pisar otro archivo.
      if (d.nombre !== clave) {
        filas[d.nombre] = filas[clave];
        filas[d.nombre].querySelector('b').textContent = d.nombre;
      }
      seguirTrabajos();
    }
  }
}

let poll = null;
async function seguirTrabajos() {
  if (poll) return;
  poll = setInterval(async () => {
    const t = await (await fetch('/api/trabajos')).json();
    let quedan = false;
    for (const [nombre, j] of Object.entries(t)) {
      if (!filas[nombre]) continue;
      if (j.estado === 'ok') pintar(nombre, j.mensaje, 1, 'lista');
      else if (j.estado === 'error') pintar(nombre, 'error: ' + j.mensaje, 1, 'mal');
      else { quedan = true; pintar(nombre, `${j.mensaje} ${((j.progreso||0)*100).toFixed(0)} %`, j.progreso); }
    }
    cargar();
    if (!quedan) { clearInterval(poll); poll = null; }
  }, 1500);
}

// De a uno por vez: dos subidas en paralelo se pelean el ancho de banda y
// tardan más las dos.
function encolar(archivos) {
  [...archivos].forEach(a => { cola = cola.then(() => subir(a)); });
}

const zona = $('zona');
zona.onclick = () => $('archivos').click();
$('archivos').onchange = e => { encolar(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.add('encima'); }));
['dragleave','drop'].forEach(ev => zona.addEventListener(ev, e => {
  e.preventDefault(); zona.classList.remove('encima'); }));
zona.addEventListener('drop', e => encolar(e.dataTransfer.files));

$('sep').onchange = () => { calcTotal(); guardar(); };
$('btnComando').onclick = () => verComando('final');
$('btnPrueba').onclick = () => exportar('prueba');
$('btnFinal').onclick = () => exportar('final');
cargar();
chequearVia();
</script>
</body>
</html>
